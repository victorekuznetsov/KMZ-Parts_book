<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход · Каталог запчастей КМЗ</title>
<link rel="icon" href="favicon.svg">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: Calibri, "Segoe UI", Arial, sans-serif; color: #e8ecee;
    background: linear-gradient(135deg, #222a30, #2a3138 60%, #1c2429);
    padding: 20px;
  }
  .box {
    width: 100%; max-width: 400px; background: #2f373e; border: 1px solid #3d454d;
    border-radius: 16px; padding: 30px 28px 26px; box-shadow: 0 18px 50px rgba(0,0,0,.35);
  }
  .mark { text-align: center; margin-bottom: 6px; }
  .mark svg { fill: #3ef0af; }
  h1 { font-size: 20px; margin: 4px 0 2px; text-align: center; }
  .sub { text-align: center; color: #9aa2a9; font-size: 13px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: #b9c0c6; margin: 12px 0 5px; }
  input {
    width: 100%; height: 44px; border-radius: 9px; border: 1px solid #4a525a;
    background: #252d33; color: #fff; padding: 0 12px; font-size: 15px;
  }
  input:focus { outline: none; border-color: #3ef0af; }
  .err { color: #ff9a9a; font-size: 13px; min-height: 18px; margin: 10px 0 2px; }
  button {
    width: 100%; height: 46px; margin-top: 12px; border: 0; border-radius: 9px;
    background: #3ef0af; color: #06231a; font-weight: 700; font-size: 15px; cursor: pointer;
  }
  button:hover { filter: brightness(.96); }
  button:disabled { opacity: .6; cursor: default; }
  .foot { text-align: center; color: #8b9299; font-size: 12px; margin-top: 18px; line-height: 1.5; }
  .foot a { color: #3ef0af; text-decoration: none; }
</style>
</head>
<body>
  <form class="box" id="form" autocomplete="on">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 196 196" width="38" height="38"><path d="M63.5941 165.078 114.786 64.5721 99.6758 31 83.5127 31 16 165.078 63.5941 165.078Z"/><path d="M107.608 118.291 152.342 118.291 179.684 64.5721 164.574 31 119.559 31 134.669 64.5721 107.608 118.291Z"/></svg>
    </div>
    <h1>Каталог запчастей КМЗ</h1>
    <div class="sub">Вход в единый каталог самосвалов</div>

    <label for="login">Логин</label>
    <input id="login" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" required>

    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <div class="err" id="err"></div>
    <button type="submit" id="btn">Войти</button>

    <div class="foot">Доступ выдаёт Кузнецов В.Е.<br>
      <a href="mailto:KuznetsovVE@industrservice.ru">KuznetsovVE@industrservice.ru</a></div>
  </form>

<script>
  (function () {
    var form = document.getElementById("form");
    var err = document.getElementById("err");
    var btn = document.getElementById("btn");
    function nextUrl() {
      var p = new URLSearchParams(location.search).get("next") || "/";
      // only allow same-origin relative paths
      if (!/^\/[^/]/.test(p) && p !== "/") p = "/";
      return p;
    }
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      err.textContent = "";
      btn.disabled = true; btn.textContent = "Проверяем…";
      fetch("/api/login", {
        method: "POST",
        credentials: "same-origin",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          login: document.getElementById("login").value,
          password: document.getElementById("password").value
        })
      }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (res.ok && res.j.ok) { location.href = nextUrl(); return; }
          err.textContent = (res.j && res.j.error) || "Не удалось войти";
          btn.disabled = false; btn.textContent = "Войти";
        })
        .catch(function () {
          err.textContent = "Сеть недоступна. Повторите попытку.";
          btn.disabled = false; btn.textContent = "Войти";
        });
    });
  })();
</script>
</body>
</html>
