<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Руководства по эксплуатации — БС-215</title>
<style>
:root{
 --ground:#eceef1;--surface:#fff;--surface-2:#f5f7f9;--line:#d8dde3;--ink:#1a1d22;--muted:#646b76;--faint:#98a0aa;
 --accent:#c05314;--accent-soft:#f4e3d7;--accent-ink:#8f3d0f;--steel:#2f4a63;--hi:#fff3d6;--hi-line:#e0a83c;
 --mono:ui-monospace,"Consolas",monospace;--sans:system-ui,-apple-system,"Segoe UI","Noto Sans",Roboto,Arial,sans-serif;}
@media(prefers-color-scheme:dark){:root{--ground:#0f1215;--surface:#181c22;--surface-2:#1f242b;--line:#2b323b;--ink:#e6e9ee;--muted:#98a1ac;--faint:#69727e;--accent:#e8792f;--accent-soft:#3a2416;--accent-ink:#f0a06a;--steel:#8fb0cd;--hi:#3a3016;--hi-line:#7a5e1e;}}
:root[data-theme="light"]{--ground:#eceef1;--surface:#fff;--surface-2:#f5f7f9;--line:#d8dde3;--ink:#1a1d22;--muted:#646b76;--faint:#98a0aa;--accent:#c05314;--accent-soft:#f4e3d7;--accent-ink:#8f3d0f;--steel:#2f4a63;--hi:#fff3d6;--hi-line:#e0a83c;}
:root[data-theme="dark"]{--ground:#0f1215;--surface:#181c22;--surface-2:#1f242b;--line:#2b323b;--ink:#e6e9ee;--muted:#98a1ac;--faint:#69727e;--accent:#e8792f;--accent-soft:#3a2416;--accent-ink:#f0a06a;--steel:#8fb0cd;--hi:#3a3016;--hi-line:#7a5e1e;}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:320px 1fr;height:100vh;height:100dvh;overflow:hidden}
aside{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.brand .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);font-weight:700;margin:0 0 3px}
.brand h1{font-size:15.5px;margin:0;font-weight:800;line-height:1.15}
.brand a.back{display:inline-block;margin-top:7px;margin-right:6px;font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 9px}
.brand a.back:hover{border-color:var(--accent);color:var(--accent-ink)}
.doctabs{display:flex;flex-wrap:wrap;gap:5px;padding:10px 12px 4px}
.doctabs button{flex:1 1 auto;min-width:60px;padding:7px 5px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:7px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.doctabs button:hover{border-color:var(--accent);color:var(--ink)}
.doctabs button.on{background:var(--steel);color:#fff;border-color:var(--steel)}
.searchbox{padding:8px 12px;position:relative}
.searchbox input{width:100%;padding:9px 11px 9px 32px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);color:var(--ink);font-size:14px;font-family:var(--sans)}
.searchbox input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.searchbox svg{position:absolute;left:22px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint);pointer-events:none}
.results{position:absolute;left:12px;right:12px;top:calc(100% - 4px);background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:0 12px 30px rgba(0,0,0,.25);max-height:70vh;overflow-y:auto;z-index:40;display:none}
.results.show{display:block}
.rcount{padding:7px 12px;font-size:11px;color:var(--faint);border-bottom:1px solid var(--line)}
.ritem{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px}
.ritem:hover{background:var(--surface-2)}
.ritem .rd{font-size:11px;color:var(--accent-ink);font-weight:700}
.ritem .rs{color:var(--muted);margin-top:2px}
.ritem mark{background:var(--accent-soft);color:var(--accent-ink)}
.seclabel{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:10px 14px 2px}
.outline{overflow-y:auto;flex:1;padding:2px 8px 10px}
.oitem{padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;border:1px solid transparent}
.oitem:hover{background:var(--surface-2)}
.oitem.on{background:var(--accent-soft);border-color:var(--accent)}
.oitem .op{color:var(--faint);font-size:11px;font-variant-numeric:tabular-nums;float:right}
.sidefoot{border-top:1px solid var(--line);padding:8px 14px;font-size:11px;color:var(--faint)}
main{overflow-y:auto;min-height:0;position:relative;display:flex;flex-direction:column}
.mhead{position:sticky;top:0;z-index:10;background:var(--ground);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:12px}
.mhead .dt{flex:1;min-width:0}
.mhead .dt .dn{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.mhead .dt h2{margin:2px 0 0;font-size:17px;font-weight:800;line-height:1.15}
.pager{display:flex;align-items:center;gap:8px;flex-shrink:0}
.pager button{background:var(--surface);border:1px solid var(--line);border-radius:7px;color:var(--muted);cursor:pointer;padding:7px 11px;font-size:14px;font-family:var(--sans)}
.pager button:hover{border-color:var(--accent);color:var(--ink)}
.pager .pos{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:70px;text-align:center}
.pageview{flex:1;padding:18px 22px 50px;display:flex;justify-content:center}
.pageview img{max-width:min(960px,100%);height:auto;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:zoom-in;align-self:flex-start;box-shadow:0 2px 14px rgba(0,0,0,.08)}
.menubtn{display:none}
.scrim{display:none}
.lb{position:fixed;inset:0;background:rgba(8,10,12,.93);z-index:100;display:none;overflow:hidden;touch-action:none}
.lb.show{display:block}
.lb img{position:absolute;left:50%;top:50%;max-width:none;transform-origin:0 0;cursor:grab;user-select:none;-webkit-user-drag:none}
.lb img.dragging{cursor:grabbing}
.lbbar{position:absolute;top:12px;right:14px;display:flex;gap:8px;z-index:110}
.lbbar button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;font-size:16px;width:38px;height:38px;cursor:pointer}
.lbbar button:hover{background:rgba(255,255,255,.22)}
.lbnav{position:absolute;top:50%;transform:translateY(-50%);z-index:110;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:26px;width:44px;height:64px;border-radius:8px;cursor:pointer}
#lbprev{left:12px}#lbnext{right:12px}
.lbhint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);color:#cfd4da;font-size:12px;z-index:110}
@media(max-width:860px){
 .app{grid-template-columns:1fr}
 aside{position:fixed;left:0;top:0;bottom:0;width:min(86vw,340px);z-index:60;transform:translateX(-105%);transition:transform .2s;box-shadow:8px 0 30px rgba(0,0,0,.25)}
 aside.open{transform:none}
 .menubtn{display:inline-block}
 .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;display:none}
 .scrim.show{display:block}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
 <aside id="aside">
  <div class="brand">
   <p class="eyebrow">Руководства по эксплуатации</p><h1>Станок буровой БС-215</h1>
   <a class="back" id="backlink" href="../index.html">‹ К единому каталогу</a>
   <a class="back" id="backlink2" href="index.html">‹ Каталог одним файлом</a>
  </div>
  <div class="doctabs" id="doctabs"></div>
  <div class="searchbox">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
   <input id="gsearch" type="search" placeholder="Поиск по тексту руководств… ( / )" autocomplete="off">
   <div class="results" id="results"></div>
  </div>
  <div class="seclabel">Содержание</div>
  <div class="outline" id="outline"></div>
  <div class="sidefoot" id="sidefoot"></div>
 </aside>
 <div class="scrim" id="scrim"></div>
 <main id="main">
  <div class="mhead">
   <button class="menubtn" id="menubtn" title="Меню">☰</button>
   <div class="dt"><div class="dn" id="docname"></div><h2 id="pagetitle"></h2></div>
   <div class="pager">
    <button id="prev" title="Предыдущая (←)">‹</button>
    <span class="pos" id="pos"></span>
    <button id="next" title="Следующая (→)">›</button>
    <button id="theme" title="Тема">◐</button>
   </div>
  </div>
  <div class="pageview"><img id="pageimg" alt="Страница руководства"></div>
 </main>
</div>
<div class="lb" id="lb">
 <div class="lbbar"><button id="lbplus">+</button><button id="lbminus">−</button><button id="lbreset">1:1</button><button id="lbclose">×</button></div>
 <button class="lbnav" id="lbprev">‹</button><button class="lbnav" id="lbnext">›</button>
 <img id="lbimg" alt="Страница крупно"><div class="lbhint">Колесо — масштаб · перетаскивание — сдвиг · Esc — закрыть</div>
</div>
<noscript><p style="padding:30px">Включите JavaScript.</p></noscript>
<script src="docs.js"></script>
<script>
(function(){
'use strict';
if(!window.DOCS||!window.DOCS.docs.length){document.body.innerHTML='<p style="padding:30px">docs.js не найден — соберите: python3 tools/build_docs.py …</p>';return;}
var D=window.DOCS.docs, st={d:0,p:0,q:''};
var $=function(id){return document.getElementById(id);};
var esc=function(s){return (s||'').replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});};
var resolveImg=function(n){return (window.DOCS_ASSETS&&window.DOCS_ASSETS[n])||('docs_img/'+n);};

/* индекс поиска: [{d,p,text_lower}] */
var IDX=[];
D.forEach(function(doc,di){doc.pages.forEach(function(pg,pi){IDX.push({d:di,p:pi,t:(pg.text||'').toLowerCase(),raw:pg.text||''});});});

/* Хеш понимает три параметра:
     #doc=<id>          открыть это руководство
     &page=<N>          на этой странице
     &q=<запрос>        сразу выполнить поиск по тексту всех руководств;
                        если doc не задан, читатель переходит на первую
                        найденную страницу. По такой ссылке из каталога
                        запчастей открывается узел в тексте руководств. */
function readHash(){
 var m={};(location.hash||'').replace(/^#/,'').split('&').forEach(function(x){var kv=x.split('=');if(kv[0])m[kv[0]]=decodeURIComponent(kv[1]||'');});
 st.q=m.q||'';
 if(m.doc){var di=D.findIndex(function(x){return x.id===m.doc;});if(di>=0){st.d=di;var p=parseInt(m.page||'1',10)||1;st.p=Math.min(Math.max(0,p-1),D[di].pages.length-1);return true;}}
 return !!st.q;
}
function saveHash(){
 history.replaceState(null,'','#doc='+D[st.d].id+'&page='+(st.p+1)+
   (st.q?'&q='+encodeURIComponent(st.q):''));
}

function renderTabs(){
 var h='';D.forEach(function(doc,i){
  var lbl=doc.title.split('—')[0].trim().split(' ').slice(0,2).join(' ');
  h+='<button data-i="'+i+'" class="'+(i===st.d?'on':'')+'" title="'+esc(doc.title)+'">'+esc(lbl)+'</button>';});
 $('doctabs').innerHTML=h;
 $('doctabs').querySelectorAll('button').forEach(function(b){b.onclick=function(){st.d=+b.dataset.i;st.p=0;render();};});
}
function renderOutline(){
 var doc=D[st.d],h='';
 if(!doc.outline.length){h='<div style="padding:10px;color:var(--faint);font-size:12.5px">Заголовки не выделены — листайте страницы или используйте поиск.</div>';}
 doc.outline.forEach(function(o,i){
  var on=(st.p+1>=o.page&&(i+1>=doc.outline.length||st.p+1<doc.outline[i+1].page));
  h+='<div class="oitem '+(on?'on':'')+'" data-p="'+(o.page-1)+'"><span class="op">'+o.page+'</span>'+esc(o.title)+'</div>';});
 $('outline').innerHTML=h;
 $('outline').querySelectorAll('.oitem').forEach(function(el){el.onclick=function(){st.p=+el.dataset.p;render();closeAside();};});
}
function render(){
 var doc=D[st.d],pg=doc.pages[st.p];
 $('docname').textContent=doc.title;
 // заголовок текущей страницы из оглавления
 var cur='';doc.outline.forEach(function(o){if(o.page<=st.p+1)cur=o.title;});
 $('pagetitle').textContent=cur||('Страница '+(st.p+1));
 $('pos').textContent=(st.p+1)+' / '+doc.pages.length;
 $('pageimg').src=resolveImg(pg.img);
 renderTabs();renderOutline();saveHash();
 $('main').scrollTop=0;
}
function step(n){var np=st.p+n;if(np<0||np>=D[st.d].pages.length)return;st.p=np;render();}

/* поиск */
var deb;
function search(q){clearTimeout(deb);deb=setTimeout(function(){runSearch(q);},130);}
function runSearch(q){
 {
 var box=$('results');q=q.trim().toLowerCase();
 if(q.length<3){box.classList.remove('show');return null;}
 var hits=[];for(var i=0;i<IDX.length&&hits.length<80;i++){var x=IDX[i];var pos=x.t.indexOf(q);if(pos>=0)hits.push({x:x,pos:pos});}
 if(!hits.length){box.innerHTML='<div class="rcount">Ничего не найдено</div>';box.classList.add('show');return hits;}
 var h='<div class="rcount">Найдено на страницах: '+hits.length+(hits.length>=80?'+':'')+'</div>';
 hits.forEach(function(hit,i){
  var x=hit.x,s=x.raw,pos=hit.pos;
  var a=Math.max(0,pos-40),b=Math.min(s.length,pos+q.length+50);
  var snip=(a>0?'…':'')+esc(s.slice(a,pos))+'<mark>'+esc(s.slice(pos,pos+q.length))+'</mark>'+esc(s.slice(pos+q.length,b))+(b<s.length?'…':'');
  h+='<div class="ritem" data-i="'+i+'"><div class="rd">'+esc(D[x.d].title.split('—')[0].trim())+' · стр. '+(x.p+1)+'</div><div class="rs">'+snip+'</div></div>';});
 box.innerHTML=h;box.classList.add('show');box._hits=hits;
 box.querySelectorAll('.ritem').forEach(function(el){el.onclick=function(){var hh=hits[+el.dataset.i].x;st.d=hh.d;st.p=hh.p;st.q='';box.classList.remove('show');$('gsearch').value='';render();closeAside();};});
 return hits;
 }
}

/* лайтбокс */
var lb=$('lb'),lbimg=$('lbimg'),scale=1,tx=0,ty=0,drag=null,moved=false;
function ap(){lbimg.style.transform='translate(-50%,-50%) translate('+tx+'px,'+ty+'px) scale('+scale+')';}
function fit(){scale=1;tx=0;ty=0;lbimg.style.maxWidth='94vw';lbimg.style.maxHeight='94vh';ap();}
function openLB(){lbimg.src=resolveImg(D[st.d].pages[st.p].img);lb.classList.add('show');fit();}
function closeLB(){lb.classList.remove('show');}
function zoom(cx,cy,f){var ns=Math.min(8,Math.max(.4,scale*f));f=ns/scale;var r=lb.getBoundingClientRect(),mx=cx-r.width/2,my=cy-r.height/2;tx=mx-(mx-tx)*f;ty=my-(my-ty)*f;scale=ns;ap();}
lb.addEventListener('wheel',function(e){e.preventDefault();zoom(e.clientX,e.clientY,e.deltaY<0?1.25:.8);},{passive:false});
lbimg.addEventListener('pointerdown',function(e){e.preventDefault();drag={x:e.clientX,y:e.clientY,tx:tx,ty:ty};moved=false;lbimg.classList.add('dragging');lbimg.setPointerCapture(e.pointerId);});
lbimg.addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;tx=drag.tx+dx;ty=drag.ty+dy;ap();});
lbimg.addEventListener('pointerup',function(){drag=null;lbimg.classList.remove('dragging');});
lbimg.addEventListener('dblclick',fit);
lb.addEventListener('click',function(e){if(e.target===lb&&!moved)closeLB();});
$('lbclose').onclick=closeLB;$('lbplus').onclick=function(){zoom(innerWidth/2,innerHeight/2,1.3);};$('lbminus').onclick=function(){zoom(innerWidth/2,innerHeight/2,.77);};$('lbreset').onclick=fit;
$('lbprev').onclick=function(){step(-1);openLB();};$('lbnext').onclick=function(){step(1);openLB();};
$('pageimg').onclick=openLB;

/* прочее */
function closeAside(){$('aside').classList.remove('open');$('scrim').classList.remove('show');}
$('menubtn').onclick=function(){$('aside').classList.add('open');$('scrim').classList.add('show');};
$('scrim').onclick=closeAside;
$('prev').onclick=function(){step(-1);};$('next').onclick=function(){step(1);};
$('gsearch').addEventListener('input',function(e){st.q=e.target.value.trim();search(e.target.value);});
document.addEventListener('click',function(e){if(!e.target.closest('.searchbox'))$('results').classList.remove('show');});
$('theme').onclick=function(){var r=document.documentElement;var cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');var nx=cur==='dark'?'light':'dark';r.setAttribute('data-theme',nx);try{localStorage.setItem('kmz.theme',nx);}catch(e){}};
try{var th=localStorage.getItem('kmz.theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'){closeLB();$('results').classList.remove('show');closeAside();return;}
 if(lb.classList.contains('show')){if(e.key==='ArrowLeft'){step(-1);openLB();}if(e.key==='ArrowRight'){step(1);openLB();}return;}
 if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){return;}
 if(e.key==='/'){e.preventDefault();$('gsearch').focus();}
 if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);
});
/* применить запрос из ссылки: подставить в поле, показать результаты и —
   если конкретное руководство не задано — открыть первую найденную страницу */
function applyQuery(jump){
 if(!st.q)return;
 $('gsearch').value=st.q;
 var hits=runSearch(st.q);
 if(jump&&hits&&hits.length){var h0=hits[0].x;st.d=h0.d;st.p=h0.p;render();}
}
window.addEventListener('hashchange',function(){
 var hadDoc=(location.hash||'').indexOf('doc=')>=0;
 if(readHash()){render();applyQuery(!hadDoc);}
});
$('sidefoot').innerHTML='Руководств: '+D.length+' · страниц: '+window.DOCS.stats.pages+'<br>Сборка: '+esc(window.DOCS.generated);
var startedWithDoc=(location.hash||'').indexOf('doc=')>=0;
readHash();render();applyQuery(!startedWithDoc);
})();
</script>
</body>
</html>
